name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/train.txt
            requirements/serve.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/train.txt -r requirements/serve.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [Path("configs/training_config.yaml"), *Path("k8s").glob("*.yaml")]
          for file in files:
              with file.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
              print(f"validated: {file}")
          PY

      - name: Check training Dockerfile
        run: docker build --check -f docker/Dockerfile.train .

      - name: Check serving Dockerfile
        run: docker build --check -f docker/Dockerfile.serve .