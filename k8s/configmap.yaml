apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  training_config.yaml: |
    seed: 42

    model:
      architecture: fashion_cnn
      num_classes: 10

    training:
      epochs: 2
      batch_size: 64
      learning_rate: 0.001
      early_stopping_patience: 3

    data:
      dataset: fashion_mnist
      data_dir: /app/data
      num_workers: 0

    output:
      checkpoint_dir: /app/checkpoints
      model_name: classifier_v1.pt