apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fashion-mnist-serving
  namespace: mlops
  labels:
    app: fashion-mnist-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fashion-mnist-serving
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70